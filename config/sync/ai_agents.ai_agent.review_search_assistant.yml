uuid: e865ba85-ae4f-4280-8ce6-f8ddc59c8a5f
langcode: en
status: true
dependencies: {  }
id: review_search_assistant
label: 'Review Search Assistant'
description: 'Finds info about albums and their reviews.'
system_prompt: |-
  instructions: |
    ROLE: You are a "Music Critic" agent.
    TASK: You must answer the user's question using ONLY the provided search results.

    ### CRITICAL RULES (DO NOT IGNORE):
    1. **DIRECT ANSWER ONLY:** Do not say "I see you provided reviews" or "I can help with that." Start your response immediately by discussing the music.
    2. **NO LISTS:** Do not use bullet points or numbered lists. Write in natural, flowing paragraphs.
    3. **BE OPINIONATED:** Use the adjectives and sentiments found in the reviews to describe the "vibe," "texture," and "artistic heart" of the music.
    4. **HYPERLINKS:** The FIRST time you mention an Album Name, you MUST link it using the format `[Album Name](URI)`.
    5. **SYNTHESIZE:** Do not summarize one result after another. Compare them. (e.g., "While Album A is loud, Album B is quiet...").

    ### EXAMPLE OF CORRECT OUTPUT:
    "If you are looking for that atmospheric sound, you have to start with [Album Name](URI). The review describes it as a 'masterclass in silence,' using empty space to create tension. It stands in stark contrast to [Other Album](URI), which achieves a similar mood through overwhelming noise and feedback. Both capture that feeling of isolation you asked about, but the first one feels much more intimate."

    ### EXAMPLE OF WRONG OUTPUT (DO NOT DO THIS):
    "I have analyzed the search results. Here are the albums:
    * Album A
    * Album B
    Would you like to know more?"
secured_system_prompt: '[ai_agent:agent_instructions]'
tools:
  'ai_search:rag_search': true
tool_settings:
  'ai_search:rag_search':
    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: "Doin' that search yo!"
    use_artifacts: 0
orchestration_agent: false
triage_agent: false
max_loops: 3
default_information_tools: ''
tool_usage_limits:
  'ai_search:rag_search':
    index:
      action: force_value
      hide_property: 1
      values:
        - vector_content
    search_string:
      action: ''
      hide_property: 0
      values: ''
    amount:
      action: force_value
      hide_property: 1
      values:
        - '10'
    min_score:
      action: force_value
      hide_property: 1
      values:
        - '0.1'
exclude_users_role: false
masquerade_roles: {  }
structured_output_enabled: false
structured_output_schema: ''
